<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Ready Self-Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#14302c;--mute:#5b7470;--acc:#0b7a75;--acc2:#e9f4f3;--warn:#c2410c;--line:#d5e3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b19;--card:#162825;--ink:#e6f2f0;--mute:#9bb5b1;--acc:#3fc1b8;--acc2:#1c3330;--warn:#fb923c;--line:#2b4642}}
:root[data-theme="dark"]{--bg:#0e1b19;--card:#162825;--ink:#e6f2f0;--mute:#9bb5b1;--acc:#3fc1b8;--acc2:#1c3330;--warn:#fb923c;--line:#2b4642}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,Arial,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;font-weight:800;margin:8px 0 4px;line-height:1.25}
.sub{color:var(--mute);margin:0 0 20px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.q p{margin:0 0 10px;font-weight:600}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1;min-width:52px;padding:10px 6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opts button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts button:focus-visible,.go:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin-top:4px}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:8px}
.err{color:var(--warn);min-height:1.5em;margin:8px 0 0;font-weight:600}
.res h2{font-size:1.25rem;margin:22px 0 8px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar span:first-child{width:130px;font-size:.9rem}
.bar i{flex:1;height:10px;background:var(--acc2);border-radius:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--acc)}
.bar.low b{background:var(--warn)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:1.05rem}
.box ul{margin:6px 0 0;padding-left:20px}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:.85rem;font-weight:600}
.re{background:none;border:1px solid var(--acc);color:var(--acc);margin-top:12px}
.hide{display:none}
.star{color:#c62828;font-weight:800}
.req{margin:0 0 20px;color:var(--mute)}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<div id="form">
<h1>Career Ready Self-Assessment</h1>
<p class="sub">When you submit this form, it will not automatically collect your details, such as name and email address, unless you provide it yourself.</p>
<p class="req"><span class="star">*</span> Required</p>
<div id="qs"></div>
<button class="go" id="go">Analyze my answers</button>
<p class="err" id="err" role="alert"></p>
</div>
<div id="out" class="res hide"></div>
</main>
<script>
const SK={
comm:{n:"Communication",tips:["Write your main point in one sentence before you speak.","Listen until the other person finishes, then repeat back what you understood.","Ask one clarifying question in every conversation."],act:"Talk with a coworker for two minutes on one topic without interrupting, then ask them to summarize what you said."},
team:{n:"Teamwork",tips:["Agree on your role and everyone else's at the start of a task.","Offer one small piece of help to a teammate each day.","When you disagree, focus on the goal, not the person."],act:"Join a small group task and split the roles together before you start."},
digi:{n:"Digital skills",tips:["Learn the basics of Word, Excel and Google Drive.","Try one new tool each week.","Practice searching well and checking the source of information."],act:"Spend 20 minutes today building a simple table in Excel or Google Sheets."},
prob:{n:"Problem solving",tips:["Write the problem down clearly and find its real cause.","Come up with 3 possible solutions before choosing one.","Test the solution on a small scale and review the result."],act:"Pick one small problem you face and write 3 solutions, then try the easiest one."},
time:{n:"Time management",tips:["Write your 3 most important tasks every day.","Use a timer: 25 minutes of focus, 5 minutes of rest.","Cut distractions: keep your phone away while you work."],act:"Plan one full day with tasks and times, and stick to it."}
};
const RATE=[["comm","Rate your confidence in communication skills."],["team","Rate your confidence in teamwork."],["digi","Rate your confidence in digital skills."],["prob","Rate your ability to solve problems."],["time","Rate your ability to manage your time."],["ease","How easy was this tool to use?"]];
const TXT=[["rights","Do you know your basic workers' rights (clear hours, fair pay)?"],["safe","Do you agree that safe conditions and fair treatment are a must in any job?"],["want","Which skill do you most want to develop?"],["plan","Which activity will you try this week?"]];
const A={};
const qs=document.getElementById("qs");
function card(text,i){const d=document.createElement("div");d.className="q";d.innerHTML="<p></p>";d.firstChild.textContent=(i+1)+". "+text+" ";const st=document.createElement("span");st.className="star";st.textContent="*";d.firstChild.appendChild(st);qs.appendChild(d);return d}
RATE.forEach(([k,t],i)=>{
 const d=card(t,i);d.insertAdjacentHTML("beforeend","<div class='opts'></div><div class='scale'><span>Low</span><span>High</span></div>");
 const o=d.querySelector(".opts");
 [1,2,3,4,5].forEach(v=>{const b=document.createElement("button");b.type="button";b.textContent=v;
  b.onclick=()=>{A[k]=v;[...o.children].forEach(c=>c.classList.toggle("on",c===b))};o.appendChild(b)});
});
TXT.forEach(([k,t],i)=>{
 const d=card(t,i+6);const inp=document.createElement("input");inp.type="text";inp.placeholder="Enter your answer";inp.setAttribute("aria-label",t);
 inp.oninput=()=>{A[k]=inp.value.trim()};d.appendChild(inp);
});
const KW={comm:/communicat|speak|talk|present|listen/,team:/team|collab|group/,digi:/digital|computer|tech|excel|software|online|coding|code/,prob:/problem|solv|critical|analy/,time:/time|organi|schedul|plan|priorit/};
const E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
document.getElementById("go").onclick=()=>{
 const need=[...RATE.map(r=>r[0]),...TXT.map(c=>c[0])];
 if(need.some(k=>A[k]===undefined||A[k]==="")){document.getElementById("err").textContent="Please answer every question first.";return}
 document.getElementById("err").textContent="";
 const R=RATE.slice(0,5);
 const sc=R.map(([k])=>[k,A[k]]).sort((a,b)=>a[1]-b[1]);
 const avg=(sc.reduce((s,x)=>s+x[1],0)/5).toFixed(1);
 const lvl=avg>=4?"You're strong overall and just need a little polish.":avg>=3?"You're at a solid middle level with clear room to grow.":"Start with the basics, one step at a time. That's completely normal.";
 const weak=sc.filter(x=>x[1]<=3).slice(0,2);
 const focus=weak.length?weak:[sc[0]];
 const w=A.want.toLowerCase();
 const wantKey=Object.keys(KW).find(k=>KW[k].test(w));
 let h=`<h2>Your score: ${avg} out of 5</h2><p>${lvl}</p>`;
 h+=R.map(([k])=>{const v=A[k];return `<div class="bar ${v<=2?"low":""}"><span>${SK[k].n}</span><i><b style="width:${v*20}%"></b></i><span>${v}</span></div>`}).join("");
 h+="<h2>The fix: what to focus on</h2>";
 focus.forEach(([k,v])=>{const s=SK[k];h+=`<div class="box"><h3>${s.n} <span class="tag">${v}/5</span></h3><ul>${s.tips.map(t=>`<li>${E(t)}</li>`).join("")}</ul></div>`});
 if(wantKey&&!focus.some(f=>f[0]===wantKey)){const s=SK[wantKey],v=A[wantKey];h+=`<div class="box"><h3>Your pick: ${s.n} <span class="tag">${v}/5</span></h3><p style="margin:0">${v>=4?"You're already good at this, so keep going with bigger projects.":"Start with these tips:"}</p><ul>${s.tips.slice(0,2).map(t=>`<li>${E(t)}</li>`).join("")}</ul></div>`}
 else if(!wantKey){h+=`<div class="box"><h3>Your goal: ${E(A.want)}</h3><p style="margin:0">Break it into a small weekly practice, and ask someone you trust for feedback every week.</p></div>`}
 const r=A.rights.toLowerCase(),sf=A.safe.toLowerCase();
 const rNo=/don'?t|do not|\bno\b|\bnot\b|never|unsure|nothing/.test(r),rSome=/some|little|bit|partly|few|somewhat/.test(r),rYes=/yes|yeah|know|sure|\bi do\b|of course/.test(r);
 let rt="";
 if(rNo)rt="Start by learning your country's labor law: working hours, minimum wage, leave and insurance. Ask your local labor office or union.";
 else if(rSome)rt="Good that you know some. Write your core rights on a page and review your contract before you sign.";
 else if(rYes)rt="Great that you know your rights. Share what you know with a coworker and never give up a right you're owed.";
 else rt="Take 15 minutes to read a summary of your country's labor law: hours, pay, leave and insurance.";
 if(/disagree|not necessary|don'?t agree|\bno\b/.test(sf))rt+=" Note: safe conditions and fair treatment are a basic right, not a luxury.";
 else if(/agree|yes|yeah|definitely|absolutely|sure|must/.test(sf))rt+=" You're right that safe conditions and fair treatment should be standard in any job.";
 h+=`<h2>Your rights at work</h2><div class="box"><p style="margin:0">${E(rt)}</p></div>`;
 const tk=wantKey||focus[0][0];
 h+=`<h2>Your activity this week</h2><div class="box"><p style="margin:0 0 8px"><b>Your plan:</b> ${E(A.plan)}</p><p style="margin:0">Make it specific: pick a day and time, and decide how you'll know it's done. A good fit for ${SK[tk].n.toLowerCase()}: ${E(SK[tk].act)}</p></div>`;
 if(A.ease<=2)h+=`<p style="color:var(--mute)">Thanks for the feedback. We'll work on making this tool easier.</p>`;
 h+=`<button class="go re" id="re">Start over</button>`;
 const out=document.getElementById("out");out.innerHTML=h;out.classList.remove("hide");
 document.getElementById("form").classList.add("hide");window.scrollTo(0,0);
 document.getElementById("re").onclick=()=>{for(const k in A)delete A[k];qs.querySelectorAll(".on").forEach(b=>b.classList.remove("on"));qs.querySelectorAll("input").forEach(i=>i.value="");out.classList.add("hide");document.getElementById("form").classList.remove("hide");window.scrollTo(0,0)};
};
</script>
</body>
</html>
